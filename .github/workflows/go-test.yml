name: Go test

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Several templates embed `{{L "..."}}` calls inside JS template
      # literals; Go 1.21 rejects this by default. Restore pre-1.21
      # behavior so the renderer doesn't return a 23-byte error stub.
      GODEBUG: "jstmpllitinterp=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go test
        run: go test ./handlers/... ./helpers/... ./config/... ./middleware/... ./models/... -count=1 -short
