name: Frontend Image

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/validate-version.sh

      - name: Read VERSION
        id: version
        run: |
          version="$(head -n 1 VERSION | sed 's/[[:space:]]//g')"
          sha="${GITHUB_SHA}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION='${{ steps.version.outputs.version }}' \
            -t '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}' \
            -t '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.sha }}' \
            .

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          docker push '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}'
          docker push '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.sha }}'
