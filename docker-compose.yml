version: '3.8'

# =============================================================================
# afrita-go (frontend) local-dev stack
# =============================================================================
# This compose file runs the frontend ONLY. It expects a backend reachable at
# $BACKEND_URL (default http://backend:8090). To bring up the full stack
# locally, run the backend's compose file (in the ifritah-go backend repo)
# on the same docker network, or attach this app to that network.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: afrita-go:dev
    container_name: afrita-go
    ports:
      - "8000:8000"
    environment:
      PORT: ${PORT:-8000}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8090}
      AFRITA_TOKEN_DIR: ${AFRITA_TOKEN_DIR:-/app/data/tokens}
    volumes:
      # Persist OAuth/session tokens across container restarts.
      - afrita-tokens:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  afrita-tokens:
