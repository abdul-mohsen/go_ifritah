# =============================================================================
# Frontend image build & push to Docker Hub
# =============================================================================
# Branch → tag mapping:
#   dev  → ssdawweq/ifritah-web:dev plus :<short SHA> and :<full SHA>
#   main → :<VERSION> plus :<short SHA> and :<full SHA>
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# =============================================================================

name: Build & Push Frontend

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: ssdawweq/ifritah-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate VERSION
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/validate-version.sh
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${version}" == "v0.0.0" ]]; then
            echo "VERSION v0.0.0 is not publishable" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set build metadata
        id: build
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            channel=dev
            docker_tag=dev
          else
            channel=release
            docker_tag="${{ steps.version.outputs.version }}"
          fi
          {
            echo "channel=${channel}"
            echo "docker_tag=${docker_tag}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "image_ref=${IMAGE_NAME}:${docker_tag}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.build.outputs.short_sha }}
            type=raw,value=${{ github.sha }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ steps.build.outputs.source }}
            org.opencontainers.image.created=${{ steps.build.outputs.created }}
            org.opencontainers.image.ref.name=${{ steps.build.outputs.image_ref }}
            com.ifritah.build.version=${{ steps.version.outputs.version }}
            com.ifritah.build.channel=${{ steps.build.outputs.channel }}
            com.ifritah.build.commit=${{ github.sha }}
            com.ifritah.build.commit_short=${{ steps.build.outputs.short_sha }}
            com.ifritah.build.image_tag=${{ steps.build.outputs.docker_tag }}
            com.ifritah.build.workflow_run_id=${{ steps.build.outputs.workflow_run_id }}
            com.ifritah.build.workflow_run_url=${{ steps.build.outputs.workflow_run_url }}
            com.ifritah.build.workflow_run=${{ steps.build.outputs.workflow_run }}
            com.ifritah.build.image_ref=${{ steps.build.outputs.image_ref }}
            com.ifritah.build.built_at=${{ steps.build.outputs.created }}
            com.ifritah.build.digest=

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE_VERSION=${{ steps.version.outputs.version }}
            APP_IMAGE_TAG=${{ steps.build.outputs.docker_tag }}
            APP_IMAGE_COMMIT=${{ github.sha }}
            APP_IMAGE_CHANNEL=${{ steps.build.outputs.channel }}
            APP_COMMIT_SHORT=${{ steps.build.outputs.short_sha }}
            APP_CHANNEL=${{ steps.build.outputs.channel }}
            APP_SOURCE=${{ steps.build.outputs.source }}
            APP_CREATED=${{ steps.build.outputs.created }}
            APP_WORKFLOW_RUN=${{ steps.build.outputs.workflow_run }}
            APP_WORKFLOW_RUN_ID=${{ steps.build.outputs.workflow_run_id }}
            APP_WORKFLOW_RUN_URL=${{ steps.build.outputs.workflow_run_url }}
            APP_BUILT_AT=${{ steps.build.outputs.created }}
            APP_IMAGE_REF=${{ steps.build.outputs.image_ref }}
            APP_IMAGE_DIGEST=
          cache-from: type=gha
          cache-to: type=gha,mode=max
