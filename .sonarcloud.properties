# SonarQube Cloud CI analysis configuration.
#
# Exclude generated assets, vendored output, helper scripts, and the
# Playwright e2e harness/specs from analysis. They are not shipped code and
# their churn was driving the new-code duplication metric over 3%.
sonar.projectKey=abdul-mohsen_go_ifritah
sonar.organization=abdul-mohsen
sonar.exclusions=static/output.css,static/css/style.css,scripts/**,quality-gate/**,tmp/**,uploads/**,node_modules/**,e2e/**,backend_suggestion/**,_BACKEND_TODO.md,_FRONTEND_MSG_*.md
sonar.test.inclusions=**/*_test.go
