# =============================================================================
# branch-image.yml — Build & push a Docker image tagged with the PR branch name
# when a PR is opened or a new commit is pushed to a PR branch.
#
# Tag format: branch name with "/" replaced by "-", e.g.
#   feature/my-thing  →  feature-my-thing
#
# Image: $DOCKERHUB_USERNAME/ifritah-web:<branch-tag>
#
# This tag is picked up by the deployment dashboard's image search so the team
# can select and deploy the exact branch build to a QA tenant before merging.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# =============================================================================

name: Branch Image (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ifritah-web

jobs:
  build-branch-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Docker image configuration
        id: image_config
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required. They are unavailable for this fork PR, so the optional image push is skipped."
            exit 0
          fi
          expected="${DOCKERHUB_USERNAME}/ifritah-web"
          if [[ -z "${IMAGE_NAME}" || "${IMAGE_NAME}" != "${expected}" ]]; then
            echo "IMAGE_NAME must be derived from DOCKERHUB_USERNAME." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compute branch tag
        id: branch_tag
        shell: bash
        run: |
          raw="${{ github.head_ref }}"
          # Replace '/' with '-'; strip leading/trailing hyphens; lowercase
          tag="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g' | sed 's/^-//;s/-$//')"
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA:0:7}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "workflow_url=${workflow_url}" >> "$GITHUB_OUTPUT"
          echo "Branch tag: ${tag}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.image_config.outputs.available == 'true'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.image_config.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        if: steps.image_config.outputs.available == 'true'
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.branch_tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ steps.branch_tag.outputs.source }}
            org.opencontainers.image.created=${{ steps.branch_tag.outputs.created }}
            org.opencontainers.image.ref.name=${{ steps.branch_tag.outputs.tag }}
            org.opencontainers.image.channel=dev
            org.opencontainers.image.workflow.run=${{ github.run_id }}
            com.ifritah.build.channel=dev
            com.ifritah.build.version=${{ steps.branch_tag.outputs.version }}
            com.ifritah.build.commit=${{ github.sha }}
            com.ifritah.build.commit_short=${{ steps.branch_tag.outputs.short_sha }}
            com.ifritah.build.tag=${{ steps.branch_tag.outputs.tag }}
            com.ifritah.build.image_tag=${{ steps.branch_tag.outputs.tag }}
            com.ifritah.build.ref=${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.tag }}
            com.ifritah.build.image_ref=${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.tag }}
            com.ifritah.build.workflow_run_id=${{ github.run_id }}
            com.ifritah.build.workflow_run_url=${{ steps.branch_tag.outputs.workflow_url }}
            com.ifritah.build.built_at=${{ steps.branch_tag.outputs.created }}
          build-args: |
            APP_VERSION=${{ steps.branch_tag.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE_VERSION=${{ steps.branch_tag.outputs.version }}
            APP_IMAGE_TAG=${{ steps.branch_tag.outputs.tag }}
            APP_IMAGE_COMMIT=${{ github.sha }}
            APP_IMAGE_CHANNEL=dev
            APP_COMMIT_SHORT=${{ steps.branch_tag.outputs.short_sha }}
            APP_CHANNEL=dev
            APP_SOURCE=${{ steps.branch_tag.outputs.source }}
            APP_CREATED=${{ steps.branch_tag.outputs.created }}
            APP_WORKFLOW_RUN=${{ github.run_id }}
            APP_WORKFLOW_RUN_ID=${{ github.run_id }}
            APP_WORKFLOW_RUN_URL=${{ steps.branch_tag.outputs.workflow_url }}
            APP_BUILT_AT=${{ steps.branch_tag.outputs.created }}
            APP_IMAGE_REF=${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
