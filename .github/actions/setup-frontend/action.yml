name: Setup frontend server
description: Build the Go binary and start it on the chosen port (used by e2e + quality-gate workflows)
inputs:
  port:
    description: Port to bind the FE on
    required: false
    default: "8001"
  backend-url:
    description: Backend API base URL
    required: false
    default: "https://dev.ifritah.com"
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install root npm deps (Tailwind)
      shell: bash
      run: npm ci || npm install

    - name: Build CSS
      shell: bash
      run: npm run build:css

    - name: Build Go binary
      shell: bash
      run: go build -o afrita .

    - name: Start frontend server
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        BACKEND_URL: ${{ inputs.backend-url }}
        APP_DOMAIN: localhost:${{ inputs.port }}
        GODEBUG: "jstmpllitinterp=1"
        AFRITA_TOKEN_DIR: ${{ github.workspace }}/.afrita-tokens
      run: |
        mkdir -p "$AFRITA_TOKEN_DIR"
        nohup ./afrita > server.log 2>&1 &
        echo $! > server.pid
        for i in $(seq 1 60); do
          if curl -sf "http://localhost:${PORT}/login" >/dev/null; then
            echo "Frontend is up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Frontend did not start within 60s"
        cat server.log
        exit 1
