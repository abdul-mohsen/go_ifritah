name: Lighthouse

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORT: "8001"
      QG_BASE: "http://localhost:8001"
      QG_USER: "admin"
      QG_PASS: "admin"
    steps:
      - uses: actions/checkout@v4

      - name: Setup frontend server
        uses: ./.github/actions/setup-frontend
        with:
          port: "8001"
          backend-url: "https://dev.ifritah.com"

      - name: Install quality-gate deps
        working-directory: quality-gate
        run: npm ci || npm install

      - name: Authenticate
        working-directory: quality-gate
        run: npm run auth

      - name: Run lighthouse
        id: lh
        working-directory: quality-gate
        run: |
          set +e
          npm run lighthouse | tee lighthouse.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: quality-gate/reports/lighthouse
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop frontend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
