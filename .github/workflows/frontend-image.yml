name: Frontend Image

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/validate-version.sh

      - name: Read VERSION
        id: version
        run: |
          version="$(head -n 1 VERSION | sed 's/[[:space:]]//g')"
          sha="${GITHUB_SHA}"
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            channel=dev
            image_ref="${FRONTEND_IMAGE}:dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            channel=release
            image_ref="${FRONTEND_IMAGE}:${version}"
          else
            channel=dev
            image_ref="${FRONTEND_IMAGE}:${short_sha}"
          fi
          docker_tag="${image_ref##*:}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${docker_tag}" >> "$GITHUB_OUTPUT"
          echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "workflow_run=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION='${{ steps.version.outputs.version }}' \
            --build-arg APP_COMMIT='${{ steps.version.outputs.sha }}' \
            --build-arg APP_IMAGE_VERSION='${{ steps.version.outputs.version }}' \
            --build-arg APP_IMAGE_TAG='${{ steps.version.outputs.docker_tag }}' \
            --build-arg APP_IMAGE_COMMIT='${{ steps.version.outputs.sha }}' \
            --build-arg APP_IMAGE_CHANNEL='${{ steps.version.outputs.channel }}' \
            --build-arg APP_COMMIT_SHORT='${{ steps.version.outputs.short_sha }}' \
            --build-arg APP_CHANNEL='${{ steps.version.outputs.channel }}' \
            --build-arg APP_SOURCE='${{ steps.version.outputs.source }}' \
            --build-arg APP_CREATED='${{ steps.version.outputs.created }}' \
            --build-arg APP_WORKFLOW_RUN='${{ steps.version.outputs.workflow_run }}' \
            --build-arg APP_WORKFLOW_RUN_ID='${{ steps.version.outputs.workflow_run }}' \
            --build-arg APP_WORKFLOW_RUN_URL='${{ steps.version.outputs.workflow_run_url }}' \
            --build-arg APP_BUILT_AT='${{ steps.version.outputs.created }}' \
            --build-arg APP_IMAGE_REF='${{ steps.version.outputs.image_ref }}' \
            -t '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.short_sha }}' \
            -t '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.sha }}' \
            -t '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}' \
            -t '${{ env.FRONTEND_IMAGE }}:dev' \
            .

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push image tags
        if: github.event_name != 'pull_request'
        run: |
          if [[ '${{ github.ref }}' == 'refs/heads/main' ]]; then
            docker push '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}'
          fi
          if [[ '${{ github.ref }}' == 'refs/heads/dev' ]]; then
            docker push '${{ env.FRONTEND_IMAGE }}:dev'
          fi
          docker push '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.short_sha }}'
          docker push '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.sha }}'
